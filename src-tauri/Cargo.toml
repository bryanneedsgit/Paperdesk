[package]
name = "paperdesk"
version = "0.1.1"
description = "Paperdesk offline-first desktop PDF workspace"
authors = ["Bryan Tan"]
license = "MIT"
repository = "https://github.com/bryanneedsgit/paperdesk-open-source"
edition = "2021"
rust-version = "1.77.2"
default-run = "paperdesk"

[lib]
name = "paperdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-single-instance = "2.4.2"
url = "2.5.8"

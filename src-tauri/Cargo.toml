[package]
name = "paperdesk"
version = "0.1.1"
description = "Paperdesk offline-first desktop PDF workspace"
authors = ["Bryan Tan"]
license = "MIT"
repository = "https://github.com/bryanneedsgit/Paperdesk"
edition = "2021"
rust-version = "1.85"
default-run = "paperdesk"

[lib]
name = "paperdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
getrandom = "0.3.3"
lopdf = { version = "0.44.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-single-instance = "2.4.2"
url = "2.5.8"
zeroize = "1.8"
